name: CI

on:
  push:
    branches: [main, dev, "rohit/dev"]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Gate G1 verification (Sprint 2)
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://hms:hms@localhost:5432/hms_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration/test_gate_g1.py -v

      - name: Tenant isolation regression (mandatory)
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://hms:hms@localhost:5432/hms_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration/test_tenant_isolation.py -v

      - name: Test
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://hms:hms@localhost:5432/hms_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
